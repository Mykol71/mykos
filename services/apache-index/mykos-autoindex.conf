# Theme generated Apache listings. Keep the normal autoindex sorting and links.
# /var/www/html is the configured document root (production resolves to /home/html).
<Directory "/var/www/html">
    IndexStyleSheet "/.mykos-index.css"
    IndexHeadInsert "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">"
    IndexOptions +FancyIndexing +HTMLTable Charset=UTF-8 NameWidth=*
    IndexIgnore .mykos-index.css .mykos-flower.svg
</Directory>
